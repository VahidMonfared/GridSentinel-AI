name: GridSentinel CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/docker/requirements-docker.txt

      - name: Run import smoke test
        run: |
          python -c "import fastapi, pandas, numpy, sklearn, faiss, sentence_transformers, langgraph; print('Imports OK')"

      - name: Check API module import
        run: |
          python -c "from src.api.app import app; print('FastAPI app import OK')"